---
# act_runner (Forgejo Actions runner). Runs jobs as sibling Docker containers
# via a Docker-in-Docker sidecar.
#
# Registration token secret, created manually:
#   kubectl exec -n forgejo deploy/forgejo -- \
#     su-exec git forgejo forgejo-cli actions generate-runner-token
#   kubectl create secret generic act-runner-secret -n forgejo \
#     --from-literal=registration-token="<token>"
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: act-runner-data
  namespace: forgejo
  labels:
    app.kubernetes.io/name: act-runner
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: forgejo
  labels:
    app.kubernetes.io/name: act-runner
    app.kubernetes.io/component: ci-runner
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate # Required for persistent volume (runner registration state)
  selector:
    matchLabels:
      app.kubernetes.io/name: act-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: act-runner
        app.kubernetes.io/component: ci-runner
    spec:
      # Pin to node05 (Pi 5)
      nodeSelector:
        kubernetes.io/hostname: node05
      containers:
        - name: dind
          image: docker:27-dind
          command:
            - dockerd-entrypoint.sh
            - --host=tcp://0.0.0.0:2375
            - --host=unix:///var/run/docker.sock
            # Matches k3s/flannel's real overlay MTU -- see PiCluster commit
            # history for why (PMTU black hole on large downloads otherwise).
            - --mtu=1450
          securityContext:
            privileged: true # Required for Docker-in-Docker
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "" # Disable TLS -- loopback-only, not exposed outside the pod
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 3000m # was 1000m -- cgroup showed real throttling (dind
                         # handles all job-container networking, so getting
                         # throttled here can look like a network stall from
                         # outside). Node has 4 cores, mostly idle.
              memory: 1Gi
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker

        - name: runner
          image: code.forgejo.org/forgejo/runner:13.0.0
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -f /data/config.yml ]; then
                forgejo-runner generate-config > /data/config.yml
              fi
              if [ ! -f /data/.runner ]; then
                forgejo-runner register \
                  --no-interactive \
                  --instance "$GITEA_INSTANCE_URL" \
                  --token "$GITEA_RUNNER_REGISTRATION_TOKEN" \
                  --name "$GITEA_RUNNER_NAME" \
                  --labels "$GITEA_RUNNER_LABELS" \
                  --config /data/config.yml
              fi
              until nc -z localhost 2375 2>/dev/null; do
                echo "waiting for docker daemon..."
                sleep 2
              done
              exec forgejo-runner daemon --config /data/config.yml
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: GITEA_INSTANCE_URL
              value: "http://forgejo.forgejo.svc.cluster.local:3000"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: act-runner-secret
                  key: registration-token
            - name: GITEA_RUNNER_NAME
              value: "picluster-node05"
            - name: GITEA_RUNNER_LABELS
              value: "docker:docker://node:20-bullseye"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: runner-data
              mountPath: /data
      volumes:
        - name: docker-data
          emptyDir: {}
        - name: runner-data
          persistentVolumeClaim:
            claimName: act-runner-data
      restartPolicy: Always

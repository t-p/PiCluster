---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/component: git-forge
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate # Required for persistent volumes
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/instance: forgejo
        app.kubernetes.io/component: git-forge
    spec:
      # Pin to node05 (Pi 5) — NVMe storage, heaviest workload node
      nodeSelector:
        kubernetes.io/hostname: node05
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - node05
      initContainers:
        # Ensure /data is owned by git user (uid 1000)
        - name: init-chown
          image: busybox:1.37
          command: ["chown", "-R", "1000:1000", "/data"]
          volumeMounts:
            - name: forgejo-data
              mountPath: /data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          env:
            # --- Server ---
            - name: FORGEJO__server__DOMAIN
              value: "forgejo.home"
            - name: FORGEJO__server__ROOT_URL
              value: "http://forgejo.home"
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__SSH_DOMAIN
              value: "forgejo.home"
            - name: FORGEJO__server__SSH_PORT
              value: "30022"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "false" # Use NodePort SSH passthrough instead
            # --- Database ---
            - name: FORGEJO__database__DB_TYPE
              value: "postgres"
            - name: FORGEJO__database__HOST
              value: "postgres.database.svc.cluster.local:5432"
            - name: FORGEJO__database__NAME
              value: "forgejo"
            - name: FORGEJO__database__USER
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: db-user
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: db-password
            # --- Security ---
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true" # Skip the web install wizard
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: secret-key
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-secret
                  key: internal-token
            # --- Service ---
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "false" # Set to true after creating your admin account
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            # --- Logging ---
            - name: FORGEJO__log__LEVEL
              value: "Info"
            - name: FORGEJO__log__MODE
              value: "console"
            # --- Mailer (disabled by default) ---
            - name: FORGEJO__mailer__ENABLED
              value: "false"
          volumeMounts:
            - name: forgejo-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18 # 3 minutes total
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-data
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/component: git-forge
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo

---
# NodePort service for SSH git access (git clone ssh://forgejo.home:30022/...)
apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/component: ssh
spec:
  type: NodePort
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30022
      protocol: TCP
  selector:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo

---
# NodePort service for direct HTTP access (bypass ingress)
apiVersion: v1
kind: Service
metadata:
  name: forgejo-nodeport
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/component: http-direct
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030
      protocol: TCP
  selector:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo

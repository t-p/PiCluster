apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathfinder
  namespace: pathfinder
  labels:
    app: pathfinder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pathfinder
  template:
    metadata:
      labels:
        app: pathfinder
    spec:
      containers:
        - name: pathfinder
          image: eqlabs/pathfinder:v0.22.7
          ports:
            - containerPort: 9545
              name: rpc
          env:
            - name: PATHFINDER_ETHEREUM_API_URL
              valueFrom:
                secretKeyRef:
                  name: pathfinder-secrets
                  key: ethereum-url
            - name: PATHFINDER_DATA_DIRECTORY
              value: "/data"
            - name: PATHFINDER_RPC_COMPILER_CONCURRENCY_LIMIT
              value: "1"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: pathfinder-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /
              port: 9545
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 9545
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: pathfinder-data
          persistentVolumeClaim:
            claimName: pathfinder-data-pvc
      nodeSelector:
        kubernetes.io/hostname: node02
      tolerations:
        - key: "arm"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

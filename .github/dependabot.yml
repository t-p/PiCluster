version: 2
updates:
  # Container images in Kubernetes manifests
  - package-ecosystem: "docker"
    directory: "/apps/argocd"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "kubernetes"

